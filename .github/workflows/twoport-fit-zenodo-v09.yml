name: PMG 0.9 Joint Real Two-Point Bridge Mobility Fit
on:
  push:
    branches: [research/v09-bridge-matrix-identification]
  workflow_dispatch:
jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install numpy scipy
      - name: Identify reciprocal positive-real two-point modal bridge models
        run: python -u tools/FitTwoPortMobility09.py --guitars 1 3 10 --output bridge-fit09
      - name: Save inferred parameters and measurement residual only
        uses: actions/upload-artifact@v4
        with:
          name: PMG09-Zenodo-Joint-2x2-Bridge-Fits
          path: bridge-fit09/TWO_PORT_09_MEASURED_MATRIX_FITS.json
          retention-days: 90
          if-no-files-found: error
