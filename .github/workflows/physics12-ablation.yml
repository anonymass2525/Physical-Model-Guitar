name: PMG 1.2 Research - Electric and Nylon Mechanism Ablation
on:
  push:
    branches:
      - research/unified-energy-v12
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install numpy scipy soundfile
      - name: Build native DSP and test all physical and regression models
        run: |
          cmake -S . -B build-ablation -DCMAKE_BUILD_TYPE=Release -DPMG_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-ablation --parallel 2
          ctest --test-dir build-ablation --output-on-failure
      - name: A/B physical modules against public clean reference notes
        run: python tools/Physics12Ablation.py --render build-ablation/PMGOfflineRender --out feature-results
      - uses: actions/upload-artifact@v4
        with:
          name: PMG12-RealRecording-Component-Ablation
          path: |
            feature-results/physics12_ablation.json
            feature-results/PHYSICS12_ABLATION_SUMMARY.md
          retention-days: 90
          if-no-files-found: error
