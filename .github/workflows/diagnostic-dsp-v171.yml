name: PMG v1.7.1 Diagnostic DSP - Linux CTest
on:
  push:
    branches:
      - research/unified-diagnostics-v171
  workflow_dispatch:
jobs:
  linux-dsp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DPMG_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-dsp --parallel 2
      - name: CTest
        run: ctest --test-dir build-dsp --output-on-failure
