name: PMG08 Probe Real Bridge Mobility Corpus
on:
  push:
    branches: [research/bridge-admittance-v08]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scipy
        run: python -m pip install scipy
      - name: Inspect raw Zenodo matrix without redistribution
        run: python -u tools/InspectBridgeCorpus.py
      - name: Upload metadata report (not underlying recordings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PMG08-Bridge-Data-Inspection
          path: bridge-probe/PROBE_REPORT.json
          retention-days: 90
          if-no-files-found: warn
