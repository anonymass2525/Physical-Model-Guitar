name: PMG08 Fit Actual Mechanical Bridge Admittance
on:
  push:
    branches: [research/bridge-admittance-v08]
    paths:
      - tools/FitZenodoBridge08.py
      - .github/workflows/identify-bridge-v08.yml
  workflow_dispatch:
jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scientific dependencies
        run: python -m pip install numpy scipy
      - name: Identify passive scalar modal fit from real hammer and accelerometer recordings
        run: python -u tools/FitZenodoBridge08.py --output bridge-results --guitars 1 3 10
      - name: Upload derived parameters and validation metrics only
        uses: actions/upload-artifact@v4
        with:
          name: PMG08-Zenodo-Guitar-Bridge-Modal-Identification
          path: bridge-results/GUITAR_BRIDGE_MODAL_FITS.json
          retention-days: 90
          if-no-files-found: error
