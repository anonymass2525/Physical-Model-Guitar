name: PMG v0.9 Real Guitar Feature Comparison
on:
  push:
    branches: [research/two-port-bridge-v09]
    paths:
      - DSP/**
      - tools/Physics09ReferenceBenchmark.py
      - tools/OfflineRender.cpp
      - .github/workflows/physics09-reference-benchmark.yml
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy soundfile
      - name: Build and run all DSP tests
        run: |
          cmake -S . -B build -DPMG_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --parallel 4 --output-on-failure
      - name: Compare v0.8 and v0.9 with real reference guitar notes
        run: python -u tools/Physics09ReferenceBenchmark.py --render build/PMGOfflineRender --out benchmark09
      - name: Upload objective features, not source recordings
        uses: actions/upload-artifact@v4
        with:
          name: PMG09-Real-Guitar-Feature-Benchmark
          path: benchmark09/physics09_reference_benchmark.json
          retention-days: 90
          if-no-files-found: error
