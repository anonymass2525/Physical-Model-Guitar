name: PMG v1.7 Coherent Direct-Body Radiation - Windows VST3 Installer
on:
  push:
    branches:
      - research/coherent-direct-body-v17
  workflow_dispatch:
jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JUCE VST3
        shell: pwsh
        run: cmake -S . -B build-win -A x64 -DPMG_BUILD_PLUGIN=ON -DBUILD_TESTING=ON
      - name: Build Release VST3 and DSP tests
        shell: pwsh
        run: cmake --build build-win --config Release --parallel 2
      - name: Test DSP and regression checks
        shell: pwsh
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: Compile v1.7 A/B research installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe unavailable" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DRepoRoot=$((Get-Location).Path)" "/DBuildRoot=$((Get-Location).Path)\build-win" "/DOutputRoot=$((Get-Location).Path)\dist" "Installer\PMG17.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\PhysicalModelGuitar-1.7-Research-Windows-x64-Setup.exe")) { throw "EXE installer missing" }
      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: PhysicalModelGuitar-1.7-Research-Windows-x64-Setup
          path: dist/PhysicalModelGuitar-1.7-Research-Windows-x64-Setup.exe
          retention-days: 90
          if-no-files-found: error
