name: PMG 1.5 - External Note Feature Validation
on:
  push:
    branches: [research/measured-observers-v15]
    paths:
      - 'DSP/**'
      - 'tools/Physics15ReferenceBenchmark.py'
      - 'tools/OfflineRender.cpp'
      - '.github/workflows/physics15-reference-benchmark.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy soundfile
      - name: Build physics / run deterministic unit tests
        run: |
          cmake -S . -B build-qa -DPMG_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-qa --parallel 3
          ctest --test-dir build-qa --output-on-failure --parallel 3
      - name: Compare experimental measured observers to v1.4 on independent guitar recordings
        run: python tools/Physics15ReferenceBenchmark.py --render "$PWD/build-qa/PMGOfflineRender" --out measured15-results
      - name: Retain metrics only; do not redistribute third-party music/audio
        uses: actions/upload-artifact@v4
        with:
          name: PMG15-External-Electric-Nylon-Feature-Ablation
          path: measured15-results/
          retention-days: 90
          if-no-files-found: error
