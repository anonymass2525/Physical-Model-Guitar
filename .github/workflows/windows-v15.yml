name: PMG v1.5 Physical Velocity-Wave Strings - Windows VST3 Installer
on:
  push:
    branches:
      - research/observer-refinement-v15
  workflow_dispatch:

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JUCE VST3
        shell: pwsh
        run: cmake -S . -B build-win -A x64 -DPMG_BUILD_PLUGIN=ON -DBUILD_TESTING=ON
      - name: Build Release physical plugin
        shell: pwsh
        run: cmake --build build-win --config Release --parallel 2
      - name: Test all unified and legacy DSP checks
        shell: pwsh
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: Compile v1.5 A/B research installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe unavailable" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DRepoRoot=$((Get-Location).Path)" "/DBuildRoot=$((Get-Location).Path)\build-win" "/DOutputRoot=$((Get-Location).Path)\dist" "Installer\PMG15.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\PhysicalModelGuitar-1.5-Research-Windows-x64-Setup.exe")) { throw "Research EXE installer missing" }
      - name: Upload opt-in EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: PhysicalModelGuitar-1.5-Research-Windows-x64-Setup
          path: dist/PhysicalModelGuitar-1.5-Research-Windows-x64-Setup.exe
          retention-days: 90
          if-no-files-found: error
      - name: Upload uninstalled VST3 backup
        uses: actions/upload-artifact@v4
        with:
          name: PhysicalModelGuitar-1.5-Windows-x64-VST3
          path: build-win/PhysicalModelGuitar_artefacts/Release/VST3/
          retention-days: 90
          if-no-files-found: error
